# Application
app.greeting=${APP_GREETING:Hello from OpenShift!}
app.environment=${APP_ENVIRONMENT:local}

# Database (PostgreSQL - configured via environment variables in OpenShift)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/workshop}
quarkus.datasource.username=${DB_USERNAME:workshop}
quarkus.datasource.password=${DB_PASSWORD:workshop}

# Hibernate ORM
quarkus.hibernate-orm.database.generation=none

# Flyway
quarkus.flyway.migrate-at-start=true

# Health (serve at /health/* instead of default /q/health/*)
quarkus.http.non-application-root-path=/
quarkus.smallrye-health.root-path=/health

# Logging
quarkus.log.level=INFO
quarkus.log.category."org.flywaydb".level=INFO
quarkus.log.category."com.example".level=INFO

# HTTP Access Log
quarkus.http.access-log.enabled=true
